<nav class="nav-bar">
  <a class="icon-link home" (click)="goToHome()">myResearch</a>

  <div class="nav-right">
    @if(this.user.isLoggedIn()) {
      @if(this.user.getCurrentUserRole() == 'admin') {
        <button class = "admin-button" (click) = "goToAdmin()">Admin Page</button>
      }
        <p>Welcome {{this.user.getCurrentUser()}}</p>
    }
    <a class="icon-link" (click)="onUserIconClick()" aria-label="Account">
      @if(!user.isLoggedIn()) {
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24" width="20" height="20"
            fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m10 17 5-5-5-5"/>
          <path d="M15 12H3"/>
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24" width="20" height="20"
            fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m16 17 5-5-5-5"/>
          <path d="M21 12H9"/>
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        </svg>
      }
    </a>
    <a class="icon-link" (click)="goToHelper()" aria-label="Needs List">
       <img src="images/funding_basket_icon.png" alt="Needs List" />
    </a>
    <a class="icon-link" (click)="goToCheckout()" aria-label="Checkout">
       <img src="images/checkout_icon.png" alt="Checkout" />
       <span class="item-count-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
    </a>

  </div>
</nav>
