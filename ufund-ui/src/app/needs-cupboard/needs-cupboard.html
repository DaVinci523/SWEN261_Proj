
<h1>Needs Cupboard</h1>

<div> 
        <input
            class="search"
            placeholder="Search Needs…"
            [(ngModel)]="searchTerm"
            (input)="getNeeds()"   
            />
</div>

<ul class="userNeeds"><!--add all userneeds to a list-->
    
    @for (need of needs; track need.id) {
        <li>
            <span class="data-container">
                <span id="need-variables">
                    <span class="identifier variable">Id: [{{need.id}}]</span> 
                    <span class="variable">Name: [{{need.name}}]</span>
                    <span class="variable">Value: [${{need.value}}]</span>
                    <span *ngIf="need.quantity <= 0" class="variable">Quantity: Surplus</span>
                    <span *ngIf="need.quantity > 0" class="variable">Quantity: {{need.quantity}}</span>
                    <span class="variable">Type: ["{{need.type}}"]</span>
                    
                </span>
                <span id="fund">
                    <button *ngIf="need.quantity > 0" id="moveToFund"type="button" (click)="moveToFunding(need)" class="fund" title="Add to Cart">Add to Cart</button>  
                    <button *ngIf="need.quantity <= 0" id="moveToFund"type="button" (click)="moveToFunding(need)" class="fund" title="Donate Extra">Dontate Extra</button> 
                </span>
            </span>
        </li>
    } 
    @empty {
        <li>There are no items.</li>
    }
</ul>
