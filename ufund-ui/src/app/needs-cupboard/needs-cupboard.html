
<h1>Needs Cupboard</h1>

<div> 
        <input
            class="search"
            placeholder="Search Needs…"
            [(ngModel)]="searchTerm"
            (input)="getNeeds()"   
            />
</div>
<div> 
        <input
            class="search"
            placeholder="Search Type…"
            [(ngModel)]="typeTerm"
            (input)="searchNeedsType()"   
            />
</div>
<div> 
        <input
            class="search"
            placeholder="Search Quantity..."        
            [(ngModel)]="qtyTerm"
            (input)="searchNeedsQuantity()"   
            />
</div>

<div> 
        <input
            class="search"
            placeholder="Search Value..."        
            [(ngModel)]="valTerm"
            (keyup.enter)="searchNeedsValue()"
            />
</div>

<ul class="userNeeds"><!--add all userneeds to a list-->
    
    @for (need of needs; track need.id) {
        @if (need.visible){ <!--only show need if it is visible-->
            <li>
                <span class="data-container">
                    <span id="need-variables">
                        <span class="identifier variable">Id: [{{need.id}}]</span> 
                        <span class="variable">Name: [{{need.name}}]</span>
                        <span class="variable">Value: [${{need.value}}]</span>
                        <span *ngIf="need.currentQuantity >= need.maxQuantity" class="variable">Quantity: Surplus</span>
                        <span *ngIf="need.currentQuantity < need.maxQuantity" class="variable">Quantity: {{need.currentQuantity}}/{{need.maxQuantity}}</span>
                        <span class="variable">Type: ["{{need.type}}"]</span>
                        
                    </span>
                    <span id="fund">
                        <button *ngIf="need.currentQuantity < need.maxQuantity" id="moveToFund"type="button" (click)="moveToFunding(need)" class="fund" title="Add to Cart">Add to Cart</button>  
                        <button *ngIf="need.currentQuantity >= need.maxQuantity" id="moveToFund"type="button" (click)="moveToFunding(need)" class="fund" title="Donate Extra">Dontate Extra</button> 
                    </span>
                </span>
            </li>
        }
    } 
    @empty {
        <li>There are no items.</li>
    }
</ul>
