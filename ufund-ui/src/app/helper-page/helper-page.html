<app-nav-bar></app-nav-bar>
@if(this.user.getCurrentUserRole() != 'admin') {
    <div id="helper-page-container">
        
        <div id="needs-cupboard" class="split left">
            <article>
                <app-needs-cupboard></app-needs-cupboard>
            </article>
        </div>

        <div id="funding-basket" class="split right">
            <article>
                <app-funding-basket></app-funding-basket>
            </article>
            <button class="checkout" type="button" (click)="goToCheckout()" title="Checkout">Go to Checkout</button>
        </div>

    </div> 
} @else {
    <div class="no-access">No Access</div>
}
