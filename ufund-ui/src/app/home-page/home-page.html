<div class="home-page">
    <!-- Upper Bar -->
     <header class="upper-bar">
        <h1>MyResearch</h1>
        @if (user.isLoggedIn()) {
            <p>Welcome {{ user.getCurrentUser() }}!</p>
        } @else {
            <button class="login-button" (click)="goToLogin()">Login</button>
        }
        <button class="checkout-button" (click)="goToCheckout()">Checkout</button>
     </header>  

     <!-- Main Page content-->
    <main class="main-content">
        <!-- Left side of the page -->
        <section class="left-section">
            <h2>Our Mission</h2>
            <p>
                We seek to nurture growth and innovation through enabling student research by providing the various tools and equipment that will be required.
            </p>
            <img src="images/swen-team-picture.jpg/" alt="Team Picture">
        </section>

        <!-- Right side: placeholder button -->
         <section class="right-section">
            <button class="fund-now-button" (click)="goToPage()">
                Fund Now
            </button>
         </section>
    </main>
</div>
