@if (visible) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-window" [style.width]="width" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h3 class="modal-title">{{ title }}</h3>
        <button class="icon-btn" type="button" aria-label="Close" (click)="modal.cancel()">×</button>
      </header>

      <section class="modal-body">
        <p>{{ message }}</p>
        <ng-content></ng-content>
      </section>

      <footer class="modal-footer">
        <button class="btn" type="button" (click)="modal.confirm()" autofocus>{{ confirmText }}</button>
        @if (showCancel) {
          <button class="btn btn-secondary" type="button" (click)="modal.cancel()">{{ cancelText }}</button>
        }
      </footer>
    </div>
  </div>
}
