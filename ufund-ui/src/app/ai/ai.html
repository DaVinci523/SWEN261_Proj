<div [style.--is-visible]="isVisible" [ngClass]="{'loading-cursor': isLoading, 'default-cursor': !isLoading}">
    <h3>Phil - (Ask it about our needs!)</h3>
    <p>{{response}}</p>
    <textarea type="text" #prompt placeholder="Enter prompt"></textarea>
    <button id="get-response" type = "aiButton" (click)="getResponse(prompt.value); triggerCursorChange();"> Get Response </button>
</div>
<button id="toggle-ai" (click)="toggleVisibility()"><strong>Ask Phil</strong></button>
